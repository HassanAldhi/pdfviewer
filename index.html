<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Darb Card Leaflets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css"> 
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>

</head>
<body>

  <div class="header">
    <img src="logo.svg" alt="Darb Pay" class="logo" onerror="this.style.display='none'">

    <div class="controls">
        <select class="lang-select" onchange="renderPDF(this.value)">
            <option value="ur-hi">🇮🇳 Urdu / 🇵🇰 Hindi</option>
            <option value="en-ar">🇬🇧 English / 🇸🇦 Arabic</option>
        </select>

        <a id="download-link" href="#" download class="btn-download" title="Download PDF">
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
        </a>
    </div>
  </div>

  <div id="pdf-container"></div>

  <script>
    const pdfMap = {
        'ur-hi': 'pdf/leaflet-ur-hi.pdf',
        'en-ar': 'pdf/leaflet-en-ar.pdf'
    };

    const container = document.getElementById('pdf-container');
    const downloadLink = document.getElementById('download-link');
    let currentRenderingTask = null;

    async function renderPDF(langKey) {
      const url = pdfMap[langKey];
      
      downloadLink.href = url;
      downloadLink.setAttribute('download', `Darb-Leaflet-${langKey}.pdf`);

      container.innerHTML = '<div class="loading-container"><div class="loading-spinner"></div><div>Memuat...</div></div>';

      try {
        const loadingTask = pdfjsLib.getDocument(url);
        currentRenderingTask = loadingTask;
        const pdf = await loadingTask.promise;

        if (currentRenderingTask !== loadingTask) return;
        container.innerHTML = ''; 

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          let targetScale = window.devicePixelRatio || 1;
          if (targetScale < 2.5) targetScale = 2.5; 
          const viewport = page.getViewport({ scale: targetScale });
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.width = Math.floor(viewport.width);
          canvas.height = Math.floor(viewport.height);
          const renderContext = { canvasContext: context, viewport: viewport };
          container.appendChild(canvas);
          await page.render(renderContext).promise;
        }
      } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<div style="color:red; padding:20px; text-align:center;">Gagal memuat PDF.</div>';
      }
    }
    window.onload = () => { renderPDF('ur-hi'); };
  </script>

</body>
</html>
